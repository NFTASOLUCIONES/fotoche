<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternamente San Valentín | Poesía y Amor</title>
    <meta name="description"
        content="Una experiencia poética para celebrar el amor en San Valentín con versos de grandes poetas.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
</head>

<body class="is-loading">
    <!-- Welcome Overlay -->
    <div id="welcome-overlay" class="welcome-overlay">
        <div class="welcome-content">
            <div class="welcome-flower">🌸</div>
            <h1 class="welcome-title">Para ti, de mi corazón</h1>
            <button id="start-btn" class="start-btn">Entrar</button>
        </div>
    </div>

    <div class="grain-overlay"></div>
    <div class="background-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- Music Control -->
    <div class="music-player-top">
        <button id="music-toggle" class="music-btn" title="Toggle Music">
            <span id="music-icon">🔇</span>
            <span class="music-text">Flightless Bird</span>
        </button>
    </div>

    <!-- Local Audio Player -->
    <audio id="bg-music" loop>
        <source src="Iron & Wine - Flightless Bird, American Mouth.mp3" type="audio/mpeg">
    </audio>

    <main class="container">
        <div class="glass-card" id="main-card">
            <div id="countdown" class="countdown-container">
                <div class="countdown-item">
                    <span id="days" class="countdown-value">00</span>
                    <span class="countdown-label">Días</span>
                </div>
                <div class="countdown-item">
                    <span id="hours" class="countdown-value">00</span>
                    <span class="countdown-label">Horas</span>
                </div>
                <div class="countdown-item">
                    <span id="mins" class="countdown-value">00</span>
                    <span class="countdown-label">Min</span>
                </div>
                <div class="countdown-item">
                    <span id="secs" class="countdown-value">00</span>
                    <span class="countdown-label">Seg</span>
                </div>
            </div>

            <div class="flower-bouquet">
                <svg viewBox="0 0 100 100" class="flower-svg">
                    <defs>
                        <radialGradient id="grad-rose" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
                        </radialGradient>
                        <radialGradient id="grad-rose-dark" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#ff758c;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#ff5e78;stop-opacity:1" />
                        </radialGradient>
                        <radialGradient id="grad-center" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
                        </radialGradient>
                    </defs>
                    <!-- Enhanced Bouquet -->
                    <g transform="translate(0, 10)">
                        <!-- Stems with better color -->
                        <path d="M50 85 L50 65" stroke="#1b3015" stroke-width="1.2" fill="none" />
                        <path d="M50 85 L35 70" stroke="#1b3015" stroke-width="1.2" fill="none" />
                        <path d="M50 85 L65 70" stroke="#1b3015" stroke-width="1.2" fill="none" />
                        <path d="M50 85 L42 68" stroke="#1b3015" stroke-width="1.2" fill="none" />
                        <path d="M50 85 L58 68" stroke="#1b3015" stroke-width="1.2" fill="none" />

                        <!-- Rich Rose Composition -->
                        <circle cx="50" cy="55" r="14" fill="url(#grad-rose)" />
                        <circle cx="50" cy="55" r="5" fill="url(#grad-center)" />

                        <circle cx="32" cy="62" r="11" fill="url(#grad-rose-dark)" />
                        <circle cx="32" cy="62" r="4" fill="url(#grad-center)" />

                        <circle cx="68" cy="62" r="11" fill="url(#grad-rose-dark)" />
                        <circle cx="68" cy="62" r="4" fill="url(#grad-center)" />

                        <circle cx="42" cy="42" r="9" fill="#f8adff" opacity="0.9" />
                        <circle cx="58" cy="42" r="9" fill="#ffb7c5" opacity="0.9" />

                        <path d="M50 85 L50 95" stroke="#d4af37" stroke-width="3" opacity="0.5" /> <!-- Ribbon -->
                    </g>
                </svg>
            </div>

            <h2 class="card-title">Para una Amiga Especial</h2>

            <div class="quote-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M14.017 21L14.017 18C14.017 16.8954 14.9124 16 16.017 16H19.017C19.5693 16 20.017 15.5523 20.017 15V9C20.017 8.44772 19.5693 8 19.017 8H16.017C15.4647 8 15.017 8.44772 15.017 9V12C15.017 12.5523 14.5693 13 14.017 13H12.017V6C12.017 4.89543 12.9124 4 14.017 4H20.017C21.1216 4 22.017 4.89543 22.017 6V15C22.017 18.3137 19.3307 21 16.017 21H14.017ZM2.01697 21L2.01697 18C2.01697 16.8954 2.9124 16 4.01697 16H7.01697C7.56925 16 8.01697 15.5523 8.01697 15V9C8.01697 8.44772 7.56925 8 7.01697 8H4.01697C3.46468 8 3.01697 8.44772 3.01697 9V12C3.01697 12.5523 2.56925 13 2.01697 13H0.0169678V6C0.0169678 4.89543 0.912399 4 2.01697 4H8.01697C9.12154 4 10.017 4.89543 10.017 6V15C10.017 18.3137 7.33068 21 4.01697 21H2.01697Z" />
                </svg>
            </div>

            <div class="quote-content">
                <p id="quote-text" class="quote-text">Cargando pensamientos...</p>
                <p id="quote-author" class="quote-author"></p>
            </div>

            <div class="divider"></div>

            <div class="controls">
                <button id="next-quote" class="btn-primary">
                    Otro Mensaje
                    <span class="heart-icon">🌸</span>
                </button>
            </div>
        </div>

        <footer class="footer">
            <p>Gracias por tu amistad</p>
        </footer>
    </main>

    <!-- Partículas de corazones se generarán por JS -->
    <div id="hearts-container"></div>

    <script src="script.js"></script>
</body>

</html>
